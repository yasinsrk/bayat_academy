services:

  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    container_name: bayat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bayat_net

  # ─── Django Backend ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bayat_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: "False"
      GUNICORN_WORKERS: 3
      PORT: 8000
    volumes:
      - static_files:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bayat_net

  # ─── React Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: bayat_frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - bayat_net

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:1.25-alpine
    container_name: bayat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - ./media:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bayat_net

volumes:
  postgres_data:
    driver: local
  static_files:
    driver: local

networks:
  bayat_net:
    driver: bridge